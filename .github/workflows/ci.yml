name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm test
      - run: npm run verify
